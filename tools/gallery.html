<!doctype html>
<html><head><meta charset="utf-8"><title>Vehicle gallery</title>
<style>body{margin:0;background:#9fb3c0}canvas{display:block}</style>

</head><body>
<script type="module">
// Developer tool: renders every vehicle model in a grid for visual review.
// Serve the repository root and open /tools/gallery.html?only=mbt,ht&yaw=0.6
import * as THREE from 'three';
import { VEHICLE_DEFS } from '/src/entities/vehicle-defs.js';
import { buildVehicleVisual } from '/src/entities/vehicle-visual.js';
const qs = new URLSearchParams(location.search);
const only = qs.get('only') ? qs.get('only').split(',') : null;
const yaw = parseFloat(qs.get('yaw') || '0.75'), elev = parseFloat(qs.get('elev') || '0.32');
const types = Object.keys(VEHICLE_DEFS).filter((t) => (only ? only.includes(t) : VEHICLE_DEFS[t].faction === 'torsa'));
const cols = Math.ceil(Math.sqrt(types.length * 1.4)), rows = Math.ceil(types.length / cols);
const W = parseInt(qs.get('w') || '1800'), H = Math.round(W / cols * 0.62) * rows;
const r = new THREE.WebGLRenderer({ antialias: true });
r.setSize(W, H); r.setScissorTest(true); document.body.appendChild(r.domElement);
for (let i = 0; i < types.length; i++) {
  const def = VEHICLE_DEFS[types[i]];
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xa8bccb);
  scene.add(new THREE.HemisphereLight(0xdfeeff, 0x6b6248, 1.3));
  const sun = new THREE.DirectionalLight(0xfff1d6, 2.4); sun.position.set(4, 8, 6); scene.add(sun);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshLambertMaterial({ color: 0x55703e }));
  ground.rotation.x = -Math.PI / 2; ground.position.y = -def.ride; scene.add(ground);
  const vis = buildVehicleVisual(def, def.faction === 'torsa' ? 1 : 0, (m) => m);
  scene.add(vis.root);
  // Pose: turret slightly traversed, gun raised for artillery so the silhouette reads.
  vis.mounts.forEach((m, k) => { if (m && k === 0) { m.yaw.rotation.y = 0.35; m.pitch.rotation.x = def.role === 'artillery' ? -0.35 : -0.05; } });
  if (def.wheels.length && vis.wheels) {
    const m4 = new THREE.Matrix4();
    def.wheels.forEach((w, k) => { m4.makeTranslation(w.pos[0], w.pos[1] - (def.suspRest - def.suspSag), w.pos[2]); vis.wheels.setMatrixAt(k, m4); });
  }
  const box = new THREE.Box3().setFromObject(vis.root);
  const size = box.getSize(new THREE.Vector3()).length(), c = box.getCenter(new THREE.Vector3());
  const cam = new THREE.PerspectiveCamera(30, (W / cols) / (H / rows), 0.1, 300);
  const d = size * 1.25;
  cam.position.set(c.x + Math.sin(yaw) * d * Math.cos(elev), c.y + Math.sin(elev) * d, c.z + Math.cos(yaw) * d * Math.cos(elev));
  cam.lookAt(c);
  const cw = W / cols, ch = H / rows, x = (i % cols) * cw, y = H - (Math.floor(i / cols) + 1) * ch;
  r.setViewport(x, y, cw, ch); r.setScissor(x, y, cw, ch);
  r.render(scene, cam);
}
const label = document.createElement('div');
label.style.cssText = 'position:absolute;inset:0;display:grid;grid-template-columns:repeat(' + cols + ',1fr);font:600 14px sans-serif;color:#fff;text-shadow:0 1px 2px #000;pointer-events:none';
for (const t of types) { const e = document.createElement('div'); e.style.padding = '6px'; e.textContent = VEHICLE_DEFS[t].label; label.appendChild(e); }
document.body.appendChild(label);
window.done = true;
</script></body></html>
